<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./contact-page.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Contact Page</title>
  </head>
  <body>
    <!-- Logo -->
    <h1 class="title logo">SMITH PHOTOGRAPHY</h1>

    <!--Navbar-->
    <nav class="navbar">
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="./contact-page.html">Contact</a></li>
      </ul>
    </nav>

    <main id="contact-main">
      <h2 class="title">Contact Us</h2>

      <form id="contact-form" action="" method="">
        <div class="flex-col">
          <label for="fName">First Name<span class="asterisk">*</span></label>
          <input id="fName" maxlength="100" />
        </div>
        <div class="flex-col">
          <label for="lName">Last Name<span class="asterisk">*</span></label>
          <input id="lName" maxlength="100" />
        </div>
        <div class="flex-col">
          <label for="email">Email<span class="asterisk">*</span></label>
          <input id="email" type="email" />
        </div>
        <div class="flex-col">
          <label for="message">Message<span class="asterisk">*</span></label>
          <textarea id="message" maxlength="1000"></textarea>
        </div>
        <button>Submit</button>
      </form>
    </main>

    <!--Footer-->
    <footer class="footer">
      <ul>
        <li>|</li>
        <li>123 Main St. Nowhere, CA 56780</li>
        <li>||</li>
        <li>(555)123-4567 | lorem@ipsum.com</li>
        <li>||</li>

        <li>|</li>
      </ul>
    </footer>
  </body>
</html>
